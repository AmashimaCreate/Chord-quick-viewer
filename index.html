   - 7つのナチュラル音ボタン（C D E F G A B）で基本ルートを選択

const FAMILY_LABEL = { open:"オープン", barre:"バレー", partial:"部分" };

function computeFormDegreeInfo(frets, rootPc, chordType) {
  const ct = CHORD_TYPES[chordType];
  if (!ct) return { degLabels: frets.map(() => ""), omittedDegrees: [] };
  const ivToDeg = {};
  ct.iv.forEach((iv, i) => { ivToDeg[iv] = ct.deg[i]; });
  const present = new Set();
  const degLabels = frets.map((f, si) => {
    if (f === -1) return "";
    const pc = mod12(TUNING_PC[si] + f);
    const interval = mod12(pc - rootPc);
    const deg = ivToDeg[interval] || "";
    if (deg) present.add(deg);
    return deg;
  });
  const omittedDegrees = ct.deg.filter(d => d !== "R" && !present.has(d));
  return { degLabels, omittedDegrees };
}

/* ─── 開発用検証（DEV_VALIDATE = true で有効化） ─── */
const DEV_VALIDATE = false;
/* validateFormDB / validateTransposeDisplay は開発時のみ使用。
   DEV_VALIDATE を true にして console で確認する。
   本番では false のまま。検証関数は省略（JSX版に同梱済み）。 */

function transposeForms(type, targetRoot) {
  const templates = FORM_DB[type];
  if (!templates) return [];
  return templates.map(tmpl => {
    if (!tmpl.movable) {
      if (tmpl.rootKey !== targetRoot) return null;
      return Object.assign({}, tmpl, { _type: type, _rootPc: tmpl.rootKey });
    }
    const shift = mod12(targetRoot - tmpl.rootKey);
    const frets = tmpl.frets.map(f => (f <= 0 ? f : f + shift));
    const played = frets.filter(f => f > 0);
    if (played.length > 0 && Math.max(...played) > 14) {
      const lowered = frets.map(f => (f > 0 ? f - 12 : f));
      if (lowered.filter(f => f > 0).every(f => f >= 1))
        return Object.assign({}, tmpl, { frets: lowered, _type: type, _rootPc: targetRoot });
    }
    return Object.assign({}, tmpl, { frets, _type: type, _rootPc: targetRoot });
  }).filter(Boolean);
}

const DEG_COLORS = {
  root:    { color: "#d9534f", label: "R" },
  third:   { color: "#2e8b57", label: "3rd" },
  fifth:   { color: "#2b7de0", label: "5th" },
  seventh: { color: "#7b5ea7", label: "7th" },
  tension: { color: "#d48a29", label: "tension" },
};

function degColor(deg) {
  if (deg === "R") return DEG_COLORS.root.color;
  if (["3","♭3"].includes(deg)) return DEG_COLORS.third.color;
  if (["5","♭5","♯5"].includes(deg)) return DEG_COLORS.fifth.color;
  if (["♭7","7","°7"].includes(deg)) return DEG_COLORS.seventh.color;
  return DEG_COLORS.tension.color;
}

function ChordDiagram({ form, theme: T, dark }) {
  const { frets, label, family, rootString, shapeName, _type, _rootPc } = form;
  const { degLabels, omittedDegrees } = (_type && _rootPc !== undefined)
    ? computeFormDegreeInfo(frets, _rootPc, _type)
    : { degLabels: frets.map(() => ""), omittedDegrees: [] };
  const playedFrets = frets.filter(f => f > 0);
  const minP = playedFrets.length ? Math.min(...playedFrets) : 1;
  const maxP = playedFrets.length ? Math.max(...playedFrets) : 4;
  const hasOpen = frets.some(f => f === 0);
  const numFrets = Math.max(4, Math.min(5, (playedFrets.length > 0 ? maxP - minP : 0) + 2));
  let startFret = (hasOpen || minP <= 3) ? 1 : Math.max(1, minP);
  if (playedFrets.length > 0 && maxP > startFret + numFrets - 1) startFret = maxP - numFrets + 1;
  const showNut = startFret === 1;
  const fW = 40, sG = 24, pL = 28, pR = 12, pT = 14, pB = 24, nX = pL;
  const w = pL + numFrets * fW + pR, h = pT + 5 * sG + pB;
  const sY = si => pT + (5 - si) * sG;
  const fX = fn => nX + (fn - startFret + 0.5) * fW;
  const familyJa = FAMILY_LABEL[family] || family;
  const infoText = `${familyJa} · ${rootString}弦R · ${shapeName}`;
  const omitText = omittedDegrees.length > 0 ? `省${omittedDegrees.join("・")}` : null;

  return (
    <div style={{ background: T.card, borderRadius: 12, padding: "12px 10px 8px", border: `1px solid ${T.border}` }}>
      <div style={{ textAlign: "center", marginBottom: 4 }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: T.text }}>{label}</div>
        <div style={{ fontSize: 10, color: T.muted, marginTop: 2, letterSpacing: 0.3, opacity: 0.85 }}>{infoText}</div>
      </div>
      <svg viewBox={`0 0 ${w} ${h}`} style={{ width: "100%", display: "block" }}>
        {showNut && <line x1={nX} y1={pT - 4} x2={nX} y2={pT + 5 * sG + 4} stroke={T.nutCol} strokeWidth={4} strokeLinecap="round" />}
        {Array.from({ length: numFrets + 1 }, (_, i) => (
          <line key={"f"+i} x1={nX + i * fW} y1={pT - 4} x2={nX + i * fW} y2={pT + 5 * sG + 4}
            stroke={i === 0 && showNut ? "none" : T.fretCol} strokeWidth={1.5} />
        ))}
        {Array.from({ length: 6 }, (_, si) => (
          <line key={"s"+si} x1={nX} y1={sY(si)} x2={nX + numFrets * fW} y2={sY(si)}
            stroke={T.strCol} strokeWidth={2.5 - si * 0.3} />
        ))}
        {Array.from({ length: numFrets }, (_, i) => (
          <text key={"n"+i} x={nX + (i + 0.5) * fW} y={h - 4}
            fontSize={12} fill={T.muted} fontWeight={600} textAnchor="middle" fontFamily="sans-serif">{startFret + i}</text>
        ))}
        {frets.map((f, si) => {
          const y = sY(si), deg = degLabels[si];
          if (f === -1) return <text key={si} x={nX - 14} y={y + 1} textAnchor="middle" dominantBaseline="central" fontSize={12} fill={T.dotMute} fontFamily="sans-serif">✕</text>;
          if (f === 0) return (<g key={si}><circle cx={nX - 14} cy={y} r={11} fill="none" stroke={T.strCol} strokeWidth={1.5} />{deg && <text x={nX - 14} y={y + 1} textAnchor="middle" dominantBaseline="central" fontSize={14} fill={T.strCol} fontWeight={800} fontFamily="sans-serif">{deg}</text>}</g>);
          if (f < startFret) return (<g key={si}><polygon points={nX-8+","+(y-5)+" "+nX-8+","+(y+5)+" "+(nX-18)+","+y} fill={degColor(deg)} /><text x={nX - 12} y={y + 1} textAnchor="middle" dominantBaseline="central" fontSize={6} fill="#fff" fontWeight={700} fontFamily="sans-serif">{deg}</text></g>);
          const cx = fX(f), col = degColor(deg), isR = deg === "R";
          const dotR = 12;
          const isLong = deg.length > 1;
          const fs = isR ? (isLong ? 11 : 14) : (isLong ? 10 : 13);
          return (<g key={si}><circle cx={cx} cy={y} r={dotR} fill={col} />{isR && <circle cx={cx} cy={y} r={dotR} fill="none" stroke="#fff" strokeWidth={2} />}<text x={cx} y={y + 1} textAnchor="middle" dominantBaseline="central" fontSize={fs} fontWeight={800} fill="#fff" fontFamily="sans-serif">{deg}</text></g>);
        })}
      </svg>
      {omitText && (
        <div style={{ textAlign: "center", marginTop: 5 }}>
          <span style={{
            display: "inline-block", fontSize: 10, fontWeight: 700,
            padding: "2px 8px", borderRadius: 4,
            background: dark ? "rgba(217,167,41,0.15)" : "rgba(212,138,41,0.12)",
            color: dark ? "#d4a829" : "#b07818",
            letterSpacing: 0.5, lineHeight: 1.4,
          }}>{omitText}</span>
        </div>
      )}
    </div>
  );
}

const ALL_ROOTS = [
  { pc: 0, sharp: "C",  flat: "C"  },
  { pc: 1, sharp: "C♯", flat: "D♭" },
  { pc: 2, sharp: "D",  flat: "D"  },
  { pc: 3, sharp: "D♯", flat: "E♭" },
  { pc: 4, sharp: "E",  flat: "E"  },
  { pc: 5, sharp: "F",  flat: "F"  },
  { pc: 6, sharp: "F♯", flat: "G♭" },
  { pc: 7, sharp: "G",  flat: "G"  },
  { pc: 8, sharp: "G♯", flat: "A♭" },
  { pc: 9, sharp: "A",  flat: "A"  },
  { pc:10, sharp: "A♯", flat: "B♭" },
  { pc:11, sharp: "B",  flat: "B"  },
];

function App() {
  const [rootPc, setRootPc] = useState(0);
  const [useFlat, setUseFlat] = useState(false);
  const [chordType, setChordType] = useState("M");
  const [dark, setDark] = useState(false);

  const NOTES = useFlat ? NOTES_FLAT : NOTES_SHARP;
  const ct = CHORD_TYPES[chordType];
  const rootName = NOTES[rootPc];
  const chordName = rootName + ct.suffix;

  const notesDeg = useMemo(() =>
    ct.iv.map((iv, i) => ({ note: NOTES[mod12(rootPc + iv)], deg: ct.deg[i] }))
  , [rootPc, chordType, useFlat]);

  const forms = useMemo(() => transposeForms(chordType, rootPc), [chordType, rootPc]);
  const groupedTypes = useMemo(() => CATEGORIES.map(cat => ({ ...cat, types: TYPE_ORDER.filter(k => CHORD_TYPES[k].cat === cat.key) })), []);

  const isNatural = NATURAL_PCS.has(rootPc);

  const T = dark
    ? { bg:"#1a1a1a", card:"#2a2a2a", border:"#3a3a3a", text:"#f0f0f0", muted:"#999", faint:"#555",
        btnBg:"#333", btnText:"#f0f0f0", btnOffBg:"#2a2a2a", btnOffText:"#aaa",
        infoBg:"#222", infoText:"#f0f0f0", infoMuted:"#888",
        nutCol:"#d4c5a0", strCol:"#666", fretCol:"#555", dotMute:"#666" }
    : { bg:"#fff", card:"#fafaf8", border:"#e8e8e4", text:"#222", muted:"#aaa", faint:"#ccc",
        btnBg:"#333", btnText:"#fff", btnOffBg:"#f0f0ee", btnOffText:"#444",
        infoBg:"#f8f8f6", infoText:"#222", infoMuted:"#aaa",
        nutCol:"#222", strCol:"#999", fretCol:"#ccc", dotMute:"#aaa" };

  const rBtn = a => ({
    padding:"7px 0", fontSize:13, fontWeight:700, borderRadius:8, border:"none", cursor:"pointer",
    background: a ? T.btnBg : T.btnOffBg, color: a ? T.btnText : T.btnOffText,
    width:44, textAlign:"center", transition:"all .12s",
  });
  const tBtn = a => ({
    padding:"5px 9px", fontSize:11, fontWeight:600, borderRadius:6, cursor:"pointer", transition:"all .12s",
    border: a ? "2px solid #d9534f" : "1px solid "+T.border,
    background: a ? "#d9534f" : dark ? T.card : "#fff", color: a ? "#fff" : dark ? "#ccc" : "#555",
  });

  return (
    <div style={{ padding:"20px 16px", maxWidth:500, margin:"0 auto", fontFamily:"'Helvetica Neue',Arial,sans-serif", color:T.text, background:T.bg, minHeight:"100vh" }}>
      <div style={{ display:"flex", justifyContent:"center", alignItems:"center", marginBottom:16, position:"relative" }}>
        <p style={{ fontSize:16, color:T.muted, margin:0, fontWeight:700 }}>Chord Quick Viewer</p>
        <button onClick={() => setDark(d => !d)} style={{
          position:"absolute", right:0, padding:"4px 8px", fontSize:11, borderRadius:6,
          border:"1px solid "+T.border, background:dark?T.card:"#f0f0ee", color:T.muted,
          cursor:"pointer", fontWeight:600,
        }}>{dark ? "☀" : "🌙"}</button>
      </div>

      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:14 }}>
        <div style={{ display:"flex", gap:4, flex:1, justifyContent:"center" }}>
          {[{n:"C",p:0},{n:"D",p:2},{n:"E",p:4},{n:"F",p:5},{n:"G",p:7},{n:"A",p:9},{n:"B",p:11}].map(x => (
            <button key={x.p} onClick={() => setRootPc(x.p)}
              style={rBtn(rootPc === x.p)}>{x.n}</button>
          ))}
        </div>
        <div style={{ display:"flex", gap:3, flexShrink:0 }}>
          <button onClick={() => {
            setUseFlat(false);
            if (isNatural) setRootPc(mod12(rootPc + 1));
            else setRootPc(mod12(rootPc - 1));
          }} style={{
            padding:"6px 10px", fontSize:14, fontWeight:800, borderRadius:8, cursor:"pointer", minWidth:36,
            border: !isNatural && !useFlat ? "2px solid #d9534f" : "1px solid "+T.border,
            background: !isNatural && !useFlat ? "#d9534f" : dark ? T.card : "#fff",
            color: !isNatural && !useFlat ? "#fff" : dark ? "#ccc" : "#555",
          }}>♯</button>
          <button onClick={() => {
            setUseFlat(true);
            if (isNatural) setRootPc(mod12(rootPc - 1));
            else setRootPc(mod12(rootPc + 1));
          }} style={{
            padding:"6px 10px", fontSize:14, fontWeight:800, borderRadius:8, cursor:"pointer", minWidth:36,
            border: !isNatural && useFlat ? "2px solid #d9534f" : "1px solid "+T.border,
            background: !isNatural && useFlat ? "#d9534f" : dark ? T.card : "#fff",
            color: !isNatural && useFlat ? "#fff" : dark ? "#ccc" : "#555",
          }}>♭</button>
        </div>
      </div>

      {!isNatural && (
        <div style={{ textAlign:"center", marginBottom:8, fontSize:11, color:T.muted }}>
          = {useFlat ? ALL_ROOTS[rootPc].sharp : ALL_ROOTS[rootPc].flat}
        </div>
      )}

      <div style={{ marginBottom:18 }}>
        {groupedTypes.map(g => (
          <div key={g.key} style={{ marginBottom:8 }}>
            <div style={{ fontSize:9, fontWeight:700, color:T.muted, letterSpacing:1.5, textTransform:"uppercase", marginBottom:4, textAlign:"center" }}>{g.label}</div>
            <div style={{
              display:"flex", justifyContent:"center", gap:4, flexWrap:"wrap",
              maxWidth: g.key === "tension" ? 380 : undefined, margin:"0 auto",
            }}>
              {g.types.map(t => (
                <button key={t} onClick={() => setChordType(t)} style={tBtn(t === chordType)}>{CHORD_TYPES[t].uiLabel}</button>
              ))}
            </div>
          </div>
        ))}
      </div>

      <div style={{ textAlign:"center", marginBottom:12, padding:"12px 16px", background:T.infoBg, borderRadius:10, border:"1px solid "+T.border }}>
        <h1 style={{ fontSize:28, fontWeight:900, margin:"0 0 8px", letterSpacing:1, color:T.infoText }}>{chordName}</h1>
        <div style={{ display:"flex", justifyContent:"center", gap:20, flexWrap:"wrap" }}>
          <div style={{ textAlign:"center" }}>
            <div style={{ fontSize:9, color:T.infoMuted, fontWeight:600, marginBottom:3, letterSpacing:1 }}>構成音</div>
            <div style={{ fontSize:15, fontWeight:700, letterSpacing:3, color:T.infoText }}>{notesDeg.map(nd => nd.note).join("  ")}</div>
          </div>
          <div style={{ width:1, background:T.border }} />
          <div style={{ textAlign:"center" }}>
            <div style={{ fontSize:9, color:T.infoMuted, fontWeight:600, marginBottom:3, letterSpacing:1 }}>度数</div>
            <div style={{ fontSize:15, fontWeight:700, letterSpacing:3, color:T.infoText }}>{notesDeg.map(nd => nd.deg).join("  ")}</div>
          </div>
        </div>
      </div>

      <div style={{ display:"flex", justifyContent:"center", gap:12, marginBottom:10, flexWrap:"wrap" }}>
        {Object.values(DEG_COLORS).map(item => (
          <div key={item.label} style={{ display:"flex", alignItems:"center", gap:3 }}>
            <span style={{
              display:"inline-block", width:8, height:8, borderRadius:"50%",
              background:item.color, flexShrink:0,
            }} />
            <span style={{ fontSize:10, color:T.muted, fontWeight:600, letterSpacing:0.3 }}>{item.label}</span>
          </div>
        ))}
      </div>

      {forms.length === 0 ? (
        <div style={{ textAlign:"center", padding:32, color:T.muted, fontSize:13, background:T.card, borderRadius:10, border:"1px solid "+T.border }}>
          表示できるフォームがありません。<br />別のキーまたはコードタイプを選んでください。
        </div>
      ) : (
        <div style={{ display:"grid", gridTemplateColumns: forms.length === 1 ? "1fr" : "1fr 1fr", gap:10 }}>
          {forms.map(form => <ChordDiagram key={form.id} form={form} theme={T} dark={dark} />)}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
